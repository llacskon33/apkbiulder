
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Comprobar archivos Gradle
        run: |
          echo "Comprobando archivos..."
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: No existe gradlew en la carpeta principal"
            exit 1
          fi

      - name: Dar permisos a Gradle
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod 755 ./gradlew
          ls -l ./gradlew

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar versión de Gradle
        run: ./gradlew --version --no-daemon

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Comprobar APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: No se ha generado el APK"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4toXboxMapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
